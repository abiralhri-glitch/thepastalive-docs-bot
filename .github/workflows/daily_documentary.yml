name: The Past Alive History Daily Documentary Bot

on:
  schedule:
    # 06:00 PM BDT (12:00 UTC), 09:00 PM BDT (15:00 UTC), 03:00 AM BDT (21:00 UTC)
    - cron: '0 12,15,21 * * *'
  workflow_dispatch:

jobs:
  post-documentary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install requests yt-dlp imageio-ffmpeg

      - name: Run Documentary Bot
        run: |
          python documentary_runner.py

      - name: Commit & Push History Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update posted history [skip ci]" && git push)
